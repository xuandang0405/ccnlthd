services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sales_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-sales_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sales_assistant} -d ${POSTGRES_DB:-sales_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s
    logging: &default-logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

  backend:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"]
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    networks: [internal]

  worker:
    build: ./backend
    command: ["python", "-m", "app.workers.documents"]
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    networks: [internal]

  notification-worker:
    build: ./backend
    command: ["python", "-m", "app.workers.notifications"]
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    networks: [internal]

  frontend:
    build: ./frontend
    depends_on: [backend]
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, backend]
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  redis_data:
  uploads:
  caddy_data:
  caddy_config:
