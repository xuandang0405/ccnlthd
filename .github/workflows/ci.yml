name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: ccnlthd_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
        working-directory: backend
      - run: ruff check app tests migrations
        working-directory: backend
      - name: SQLite tests
        run: pytest
        working-directory: backend
      - name: MySQL ORM and API tests
        run: >-
          pytest --cov=app --cov-branch --cov-report=term-missing
          --cov-report=xml:coverage.xml --cov-report=html:htmlcov
          --junitxml=test-results.xml
        working-directory: backend
        env:
          TEST_DATABASE_URL: mysql+aiomysql://root:ci-password@127.0.0.1:3306/ccnlthd_test_ci?charset=utf8mb4
      - name: Coverage gate for error handling and authentication helpers
        run: >-
          coverage report
          --include="*/core/errors.py,*/core/observability.py,*/core/security.py"
          --fail-under=80
        working-directory: backend
      - name: Save test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence
          path: |
            backend/coverage.xml
            backend/htmlcov/
            backend/test-results.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Check migration matches models
        run: |
          python -m alembic upgrade head
          python -m alembic check
        working-directory: backend
        env:
          DATABASE_URL: mysql+aiomysql://root:ci-password@127.0.0.1:3306/ccnlthd_test_ci?charset=utf8mb4

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
