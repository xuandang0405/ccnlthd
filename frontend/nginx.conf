server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30m;

    # Giữ nguyên URL /api/v1; không trả index.html khi API báo lỗi.
    location ~ ^/(api/|health/|docs|redoc|openapi\.json$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /widget.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /widget/ {
        # Phục vụ index ngay tại location này để không mất header cho phép iframe.
        try_files $uri /index.html =404;
        add_header Content-Security-Policy "frame-ancestors *" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }
}
